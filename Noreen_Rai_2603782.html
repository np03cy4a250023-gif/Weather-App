<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Weather app</title>
    <link rel="stylesheet" href="Noreen_Rai_2603782.css">
    
</head>
<body>
<div class="container">
    <h1>Weather App</h1>
        <form class="search-box">
            <input type="search" id="searchBox" placeholder="Enter city name"> 
            <button id="button">Search</button>
        </form>
      <div id="day-date">
        <div id="day">Day: Tuesday</div>
        <div id="date">Date: April 2, 2025</div>
      </div>
    <div class="weather">
        <img id="icon" src="https://openweathermap.org/img/wn/01d@2x.png" class="weather-icon">
        <div id="temp">21°C</div>
        <div id="city">Fife</div>
        <div id="weathercondition">Hot</div>
        <div id="mainweather">Sunny</div>
        <div class="details">
            <div class="col">
                <i class="bi bi-moisture"></i>
                <div>
                <p class="humidity">60%</p>
                <p>Humidity</p>
                </div>
            </div>
        </div>
        <br>
        <div class="details">
            <div class="col"id="wind">
                <i class="fa-solid fa-wind"></i>
                <div>
                <p class="wind">20Km/h</p>
                <p>Wind Speed</p>
                </div>
            </div>
        </div>
        <br>
        <div class="details">
            <div class="col">
                <i class="bi bi-speedometer"></i>
                <div>
                <p class="pressure">60%</p>
                <p>Pressure</p>
                </div>
            </div>
        </div>
        <br>
        <div class="details">
            <div class="col">
                <i class="fa-solid fa-compass"></i>
                <div>
                <p class="direction">60%</p>
                <p>Direction</p>
                </div>
            </div>
        </div>
    </div>
     <footer>
      <p>Copyright © Noreen Rai, 2603782</p>
    </footer>
</div>
<script src="Noreen_Rai_2603782.js"></script>
</body>
</html>
